# Alembic configuration.
#
# NOTE: this file must stay ASCII-only. Python's configparser reads it with the
# *locale* encoding (GBK on this Windows box), so non-ASCII comments make Alembic
# fail to parse its own config with a UnicodeDecodeError before anything runs.
#
# The database URL is deliberately NOT set here: connection details come from the
# application config (.env POSTGRES_*), injected in alembic/env.py. Duplicating it
# in two places guarantees drift -- migrations run against database A while the app
# connects to database B.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamp-prefixed filenames so migrations sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
